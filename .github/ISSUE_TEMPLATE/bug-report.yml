---
name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    attributes:
      label: Current Behavior
      description: A concise description of what you're experiencing.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
      description: A concise description of what you expected to happen.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. With this key spec...
        1. Run 'cosign ...'
        1. See error...
    validations:
      required: false
  - type: input
    id: plugin_version
    attributes:
      label: Plugin Version
      description: What version of sigstore-kms-exoscalekms are you running?
    validations:
      required: true
  - type: input
    id: cosign_version
    attributes:
      label: Cosign Version
      description: What version of cosign are you running?
    validations:
      required: true
  - type: input
    id: os_platform
    attributes:
      label: Os platform
      description: What version of OS are you using?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output, without API keys or secrets. This will be automatically formatted into code, so no need for backticks.
      render: shell
