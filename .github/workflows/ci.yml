name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Weekly run catches new cosign releases and new Go advisories.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          install-mode: binary
          args: --timeout 4m --build-tags e2e
      - run: shellcheck install.sh

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  cosign:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cosign: [v3.1.4, latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          go install github.com/sigstore/cosign/v3/cmd/cosign@${{ matrix.cosign }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: go test -tags e2e -run TestCosign ./...
