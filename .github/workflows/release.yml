name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  # Sign build provenance for the release assets with the workflow's OIDC token.
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      # goreleaser-action is not on the org allowlist of actions.
      - run: go run github.com/goreleaser/goreleaser/v2@v2.18.3 release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest@v4.2.2
        with:
          subject-checksums: dist/checksums.txt
